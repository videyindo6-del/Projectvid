<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f7fb"><title>Profil Member — BoxCellink</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="/css/shared.css"><link rel="stylesheet" href="/css/navbar.css?v=20261121-memberprofile-v3"><link rel="stylesheet" href="/css/footer.css"><link rel="stylesheet" href="/css/social-posts.css?v=20261121-memberprofile-v3"><link rel="stylesheet" href="/css/member-profile.css?v=20261121-memberprofile-v3"></head>
<body><div data-component="navbar"></div><main class="bc-social-main bc-member-profile-main">
<header class="bc-public-profile-head" id="bcPublicProfile"><div class="bc-public-profile-mark" id="bcProfileAvatar">M</div><div class="bc-public-profile-copy"><span class="bc-social-eyebrow" data-profile-i18n="public_profile">PUBLIC PROFILE</span><h1 id="bcProfileName">Memuat profil...</h1><p id="bcProfileUsername">@username</p><div id="bcProfileStatus"></div><div id="bcProfileBio" class="bc-profile-bio"></div><div id="bcProfileSocials" class="bc-profile-socials"></div><div id="bcProfileActions" class="bc-profile-actions"></div></div></header>
<section class="bc-profile-chat-panel" id="bcProfileChat" hidden><div class="bc-profile-chat-head"><div><b data-profile-i18n="chat_title">Chat</b><small id="bcChatPartner">Direct message</small></div><button type="button" id="bcChatClose" aria-label="Close chat"><i class="fa-solid fa-xmark"></i></button></div><div class="bc-profile-chat-messages" id="bcChatMessages" aria-live="polite"></div><form id="bcChatForm" class="bc-profile-chat-form"><input id="bcChatInput" maxlength="2000" autocomplete="off" placeholder="Tulis pesan..." required><button type="submit" aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button></form></section>
<section class="bc-profile-posts-section"><div class="bc-profile-posts-heading"><div><span class="bc-social-eyebrow" data-profile-i18n="member_activity">MEMBER ACTIVITY</span><h2 id="bcProfilePostsTitle" data-profile-i18n="posts_title">Publikasi</h2><p id="bcProfilePostsDesc" data-profile-i18n="posts_desc">AutoLink dan PasteLink yang dibagikan member ini.</p></div></div><section class="bc-post-feed" id="bcPostFeed" aria-live="polite"><div class="bc-post-loading"><i class="fa-solid fa-spinner fa-spin"></i> Memuat postingan...</div></section></section></main><div data-component="footer"></div>
<script src="/components.js?v=20261115-4"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/config.js"></script><script src="/js/social-posts.js?v=20261121-memberprofile-v3"></script><script src="/js/page-i18n.js"></script></body></html>
