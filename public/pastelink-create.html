<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buat Paste Link — BoxCellink</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="/css/shared.css"><link rel="stylesheet" href="/css/navbar.css"><link rel="stylesheet" href="/css/footer.css"><link rel="stylesheet" href="/css/autolink.css"><style>.pl-wrap{max-width:760px;margin:32px auto;padding:0 16px}.pl-card{background:var(--card-bg,#fff);border:1px solid var(--border-color,#dbe2ea);border-radius:18px;padding:22px}.pl-field{display:grid;gap:7px;margin:16px 0}.pl-field input,.pl-field textarea,.pl-field select{width:100%;padding:12px;border:1px solid var(--border-color,#cbd5e1);border-radius:10px;font:inherit}.pl-field textarea{min-height:180px}.pl-help{color:var(--muted,#64748b);font-size:13px}.pl-alert{padding:12px;border-radius:10px;background:#eff6ff;margin:12px 0;overflow-wrap:anywhere}</style></head><body><div data-component="navbar"></div><main class="pl-wrap"><header><span class="al-kicker">PUBLISHER STUDIO</span><h1 id="plHeading">Buat Paste Link</h1><p>Buat halaman berisi teks dan tautan yang bisa dibuka langsung.</p></header><section class="pl-card"><form id="plForm"><div class="pl-field"><label for="plTitle">Judul</label><input id="plTitle" maxlength="140" required placeholder="Judul Paste Link"></div><div class="pl-field"><label for="plContent">Konten</label><textarea id="plContent" maxlength="12000" required placeholder="Tulis konten. URL http://, https://, dan www. akan otomatis menjadi tautan."></textarea><small class="pl-help">Tautan http://, https://, dan www. di dalam konten akan otomatis bisa diklik.</small></div><div class="pl-field"><label for="plPassword">Password (opsional)</label><input id="plPassword" type="password" maxlength="120" autocomplete="new-password" placeholder="Kosongkan jika tidak perlu password"></div><div class="pl-field"><label for="plExpiry">Expired</label><select id="plExpiry"><option value="">Tidak kedaluwarsa / pertahankan saat edit</option><option value="0">Hapus batas kedaluwarsa</option><option value="1">1 hari</option><option value="7">7 hari</option><option value="30">30 hari</option><option value="90">90 hari</option></select></div><div id="plMessage" aria-live="polite"></div><button class="al-btn full" id="plSubmit" type="submit"><i class="fa-solid fa-paper-plane"></i> Buat Paste Link</button></form><div id="plResult" hidden></div></section></main><div data-component="footer"></div><script src="/components.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/config.js"></script><script src="/js/pastelink-create.js"></script><script src="/js/page-i18n.js"></script></body></html>
