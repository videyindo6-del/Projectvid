<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pembayaran AutoLink — BoxCellink</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="/css/shared.css"><link rel="stylesheet" href="/css/navbar.css"><link rel="stylesheet" href="/css/footer.css"><link rel="stylesheet" href="/css/autolink.css"></head><body><div data-component="navbar"></div><main class="al-page"><div class="al-wrap" style="max-width:650px"><section class="al-card"><span class="al-kicker">Direct Access</span><h1>Pembayaran Langsung Akses</h1><p style="color:var(--al-muted)">Harga tetap <b>Rp3.500</b>. Publisher menerima Rp2.000 dan platform Rp1.500 setelah pembayaran terverifikasi.</p><div id="alPaymentInfo" class="al-note">Menyiapkan pembayaran...</div>

</div>
<div class="al-actions">
 <button class="al-btn full" id="alCreatePayment">Lanjutkan · Rp3.500</button>
 <button class="al-btn secondary full" id="alCheckPayment" hidden>Saya sudah membayar · Periksa status</button>
</div><div id="alPaymentMessage"></div><a href="#" id="alPaymentCheckout" class="al-btn ghost full" target="_blank" rel="noopener" hidden>Buka halaman pembayaran Cashi</a></section></div></main><div data-component="footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/config.js"></script><script src="/components.js"></script><script src="/js/autolink-payment.js"></script><script src="/js/page-i18n.js"></script></body></html>
