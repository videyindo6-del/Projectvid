<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f9fc"><meta name="description" content="Baca konten PasteLink yang dibagikan melalui BoxCellink.">
<title>PasteLink — BoxCellink</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="/css/shared.css"><link rel="stylesheet" href="/css/navbar.css"><link rel="stylesheet" href="/css/footer.css"><link rel="stylesheet" href="/css/social-posts.css"><link rel="stylesheet" href="/css/autolink.css">
<style>
:root{--pl-ink:#152238;--pl-muted:#718096;--pl-line:#e8edf4;--pl-gold:#f6c453;--pl-gold-deep:#9a6500}
.pl-view-main{width:min(880px,calc(100% - 28px));margin:clamp(22px,4vw,42px) auto 76px;}
.pl-view-card{background:linear-gradient(180deg,#fff 0%,#fcfdff 100%);border:1px solid #e7edf5;border-radius:26px;padding:clamp(19px,4vw,40px);box-shadow:0 22px 65px rgba(20,39,72,.085);}
.pl-view-label{display:inline-flex;align-items:center;gap:8px;background:#fff8e4;color:#936000;border:1px solid #f4dfaa;border-radius:999px;padding:7px 12px;font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}
.pl-view-card h1{font-size:clamp(25px,4.2vw,38px);line-height:1.16;letter-spacing:-.035em;color:var(--pl-ink);margin:17px 0 14px;overflow-wrap:anywhere}
.pl-view-meta{display:flex;align-items:center;flex-wrap:wrap;gap:7px 14px;color:#8591a3;font-size:11px;margin:0 0 23px;padding-bottom:17px;border-bottom:1px solid var(--pl-line)}
.pl-view-meta span{display:inline-flex;align-items:center;gap:6px}.pl-view-meta i{color:#a0adbd}.pl-view-meta .pl-view-count{color:#64748b;font-weight:800}.pl-view-meta .pl-view-count i{color:#c18b1d}
.pl-view-promo{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 23px;padding:15px 16px;border:1px solid rgba(241,190,71,.62);border-radius:17px;background:linear-gradient(112deg,#fff9e8 0%,#fff1c7 48%,#fffaf0 100%);box-shadow:0 8px 24px rgba(190,135,25,.11)}
.pl-view-promo:before{content:"";position:absolute;z-index:-1;inset:-50% auto -50% -35%;width:28%;transform:rotate(20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);animation:plGoldShine 4.8s ease-in-out infinite}
.pl-view-promo:after{content:"";position:absolute;z-index:-1;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.65);pointer-events:none}
@keyframes plGoldShine{0%,55%{left:-40%;opacity:0}65%{opacity:1}100%{left:130%;opacity:0}}
.pl-view-promo-copy{min-width:0}.pl-view-promo-kicker{display:flex;align-items:center;gap:6px;color:#9a6a0b;font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px}.pl-view-promo-kicker i{animation:plGoldTwinkle 1.8s ease-in-out infinite}
@keyframes plGoldTwinkle{0%,100%{opacity:.55;filter:brightness(1)}50%{opacity:1;filter:brightness(1.5)}}
.pl-view-promo p{margin:0;color:#674b17;font-size:12px;line-height:1.55;font-weight:650}.pl-view-promo-actions{display:flex;flex-shrink:0;gap:7px;align-items:center}
.pl-view-promo-actions a{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 12px;border-radius:10px;text-decoration:none;font-size:11px;font-weight:850;transition:transform .2s,box-shadow .2s}.pl-view-promo-actions a:hover{transform:translateY(-2px)}
.pl-view-register{color:#fff;background:linear-gradient(135deg,#b98112,#e8b53f);box-shadow:0 5px 13px rgba(178,124,17,.22)}.pl-view-login{color:#81590c;background:rgba(255,255,255,.78);border:1px solid #ecd18d}
.pl-view-ad{display:flex;justify-content:center;align-items:center;min-height:0;width:100%;margin:0 0 18px;overflow:hidden;border-radius:12px}.pl-view-ad:empty{display:none}
.pl-view-content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;color:#29384e;font-size:15px;border-top:1px solid #edf0f5;padding-top:23px;min-height:70px}.pl-view-content a{color:#1769d2;text-decoration:underline;text-underline-offset:3px}.pl-view-content p{margin:0}
.pl-view-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid #edf0f5;margin-top:25px;padding-top:17px;color:#8995a6;font-size:11px}.pl-view-footer a{color:#2563c7;text-decoration:none;font-weight:800}
.pl-view-error{color:#a12b35;background:#fff1f2;border:1px solid #fecdd3;border-radius:12px;padding:13px;font-size:13px}.pl-view-password{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.pl-view-password input{flex:1;min-width:180px;padding:12px 14px;border:1px solid #d8e0eb;border-radius:11px}.pl-view-password button{border:0;border-radius:11px;background:#1c64c8;color:#fff;padding:12px 18px;font-weight:800}
@media(max-width:560px){.pl-view-main{width:calc(100% - 20px);margin:18px auto 48px}.pl-view-card{border-radius:19px;padding:18px 15px}.pl-view-promo{align-items:flex-start;flex-direction:column;padding:13px}.pl-view-promo-actions{width:100%}.pl-view-promo-actions a{flex:1}.pl-view-meta{font-size:10px;gap:7px 11px}.pl-view-content{font-size:14px}}
@media(prefers-reduced-motion:reduce){.pl-view-promo:before,.pl-view-promo-kicker i{animation:none}}
</style>
</head>

<main class="pl-view-main"><article id="plPage" class="pl-view-card" aria-live="polite">
<span class="pl-view-label"><i class="fa-solid fa-link"></i> PASTELINK</span><p>Memuat konten...</p>
</article></main>
<div data-component="footer"></div>
