<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Withdraw Publisher — BoxCellink</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="/css/shared.css"><link rel="stylesheet" href="/css/navbar.css"><link rel="stylesheet" href="/css/footer.css"><link rel="stylesheet" href="/css/autolink.css"></head><body><div data-component="navbar"></div><main class="al-page"><div class="al-wrap"><header class="al-head"><div><span class="al-kicker">Publisher Wallet</span><h1>Withdraw Publisher</h1><p>Saldo publisher terpisah dari deposit dan saldo afiliasi.</p></div><a class="al-btn ghost" href="/publisher-dashboard.html">Dashboard</a></header><section class="al-stats" id="alWithdrawStats"><div class="al-stat"><small>Total saldo publisher</small><strong>—</strong></div><div class="al-stat"><small>Saldo tersedia</small><strong>—</strong></div><div class="al-stat"><small>Dalam proses</small><strong>—</strong></div><div class="al-stat"><small>Sudah ditarik</small><strong>—</strong></div></section><section class="al-card" style="margin-top:18px"><h2>Ajukan Withdraw</h2><form id="alWithdrawForm"><div class="al-field"><label>Nominal penarikan (minimal Rp10.000)</label><input type="number" id="alWithdrawAmount" min="10000" step="1000" required></div><div class="al-field"><label>Metode</label><select id="alWithdrawMethod"><option value="bank">Bank</option><option value="ewallet">E-Wallet</option></select></div><div class="al-field"><label>Bank / E-Wallet</label><input id="alWithdrawProvider" required placeholder="Contoh: BCA / DANA"></div><div class="al-field"><label>Nama pemilik rekening</label><input id="alWithdrawHolder" required maxlength="100"></div><div class="al-field"><label>Nomor rekening / tujuan</label><input id="alWithdrawAccount" required maxlength="80"></div><div id="alWithdrawMessage"></div><button class="al-btn" id="alWithdrawSubmit">Ajukan Withdraw</button></form></section><section class="al-card" style="margin-top:18px"><h2>Riwayat Withdraw</h2><div class="al-table-wrap"><table class="al-table"><thead><tr><th>Tanggal</th><th>Nominal</th><th>Tujuan</th><th>Status</th><th>Catatan</th></tr></thead><tbody id="alWithdrawRows"><tr><td colspan="5">Memuat...</td></tr></tbody></table></div></section></div></main><div data-component="footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/config.js"></script><script src="/components.js"></script><script src="/js/publisher-withdraw.js"></script><script src="/js/page-i18n.js"></script></body></html>
