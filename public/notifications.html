<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifikasi — BoxCellink</title><link rel="stylesheet" href="/css/shared.css"><link rel="stylesheet" href="/css/navbar.css"><link rel="stylesheet" href="/css/footer.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><style>.notice-page{max-width:900px;margin:36px auto;padding:0 16px 60px}.notice-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.notice-actions{display:flex;gap:8px;flex-wrap:wrap}.notice-actions button{border:1px solid var(--line,#dce5ef);border-radius:10px;padding:9px 12px;background:var(--surface,#fff);cursor:pointer}.notice-list{display:grid;gap:10px;margin-top:20px}.notice-card{padding:16px;border:1px solid var(--line,#dce5ef);border-radius:15px;background:var(--surface,#fff)}.notice-card.unread{border-color:#8bb7e8;background:color-mix(in srgb,#3478bd 6%,var(--surface,#fff))}.notice-card h3{margin:0 0 6px;font-size:15px}.notice-card p{margin:0;color:var(--muted,#718096);line-height:1.55}.notice-meta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px;font-size:11px;color:var(--muted,#718096)}.notice-meta button{border:0;background:transparent;color:#b42318;cursor:pointer}.notice-empty{padding:36px;text-align:center;color:var(--muted,#718096)}</style></head><body><div data-component="navbar"></div><main class="notice-page"><div class="notice-head"><div><span class="eyebrow">BOXCELLINK · INBOX</span><h1>Notifikasi</h1><p>Pengumuman admin, pembelian, membership, dan komisi afiliasi.</p></div><div class="notice-actions"><button id="markAll">Tandai semua dibaca</button><button id="deleteAll">Hapus notifikasi saya</button></div></div><section class="notice-card" id="adminAnnouncementPanel"><h2>Pengumuman Admin</h2><div id="adminAnnouncements">Memuat pengumuman...</div></section><div id="noticeList" class="notice-list">Memuat notifikasi...</div></main><div data-component="footer"></div><script src="/components.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/config.js"></script><script src="/js/notifications.js"></script></body></html>
