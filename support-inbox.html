<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Inbox — Boxcelink</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="css/shared.css"><link rel="stylesheet" href="css/navbar.css"><link rel="stylesheet" href="css/footer.css"><link rel="stylesheet" href="css/support-inbox.css"></head>
<body><div data-component="navbar"></div><main class="si-wrap"><div class="si-head"><div><span>ADMIN WORKSPACE</span><h1><i class="fa-solid fa-headset"></i> Support Inbox</h1><p>Kelola percakapan bantuan dari seluruh member Boxcelink.</p></div><a href="admin.html"><i class="fa-solid fa-arrow-left"></i> Panel Admin</a></div>

</main><div data-component="footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="components.js"></script><script src="js/support-inbox.js"></script></body></html>
